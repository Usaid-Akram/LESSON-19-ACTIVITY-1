<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction To Java-Script</title>
</head>
<body>
    <h1 id="myh"></h1>
    <p id="myp"></p>
    <script>
        //My Heading
        document.getElementById("myh").innerHTML = "Hello World";
        //My Paragraph
        document.getElementById("myp").innerHTML = "This is a simple paragraph.";
    </script>
</body>
</html>
